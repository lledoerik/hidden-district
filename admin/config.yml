backend:
  name: github
  repo: lledoerik/hidden-district
  branch: main
  base_url: https://api.netlify.com

# Carpeta de medios (imágenes subidas desde el CMS)
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

# El CMS edita un único fichero JSON
collections:
  - name: "contenido"
    label: "Contenido del sitio"
    files:

      # ── Fichero principal ────────────────────────────────────────────────────
      - name: "content"
        label: "Contenido principal"
        file: "content.json"
        format: json
        fields:

          # ── Hero ─────────────────────────────────────────────────────────────
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Tagline",  name: "tagline", widget: "string" }

          # ── El Distrito ───────────────────────────────────────────────────────
          - label: "El Distrito"
            name: "distrito"
            widget: "object"
            fields:
              - { label: "Título",    name: "titulo",    widget: "string" }
              - { label: "Intro",     name: "intro",     widget: "text" }
              - { label: "Párrafo 1", name: "parrafo1",  widget: "text" }
              - { label: "Párrafo 2", name: "parrafo2",  widget: "text" }

          # ── Cócteles ──────────────────────────────────────────────────────────
          - label: "Cócteles de Autor"
            name: "cocteles"
            widget: "object"
            fields:
              - { label: "Título",    name: "titulo",    widget: "string" }
              - { label: "Subtítulo", name: "subtitulo", widget: "text" }
              - label: "Lista de cócteles"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Nombre",      name: "nombre",      widget: "string" }
                  - { label: "Ingredientes", name: "ingredientes", widget: "string" }
                  - { label: "Precio",      name: "precio",      widget: "string" }
                  - { label: "Imagen",      name: "imagen",      widget: "image", required: false }

          # ── Tapas ─────────────────────────────────────────────────────────────
          - label: "Tapas"
            name: "tapas"
            widget: "object"
            fields:
              - label: "Lista de tapas"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Nombre",      name: "nombre",      widget: "string" }
                  - { label: "Ingredientes", name: "ingredientes", widget: "string" }
                  - { label: "Precio",      name: "precio",      widget: "string" }
                  - { label: "Imagen",      name: "imagen",      widget: "image", required: false }

          # ── Eventos ───────────────────────────────────────────────────────────
          - label: "Eventos"
            name: "eventos"
            widget: "object"
            fields:
              - { label: "Título",    name: "titulo",    widget: "string" }
              - { label: "Subtítulo", name: "subtitulo", widget: "string" }
              - label: "Lista de eventos"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Día",         name: "dia",         widget: "string" }
                  - { label: "Mes (abrev.)", name: "mes",         widget: "string" }
                  - { label: "Título",       name: "titulo",      widget: "string" }
                  - { label: "Descripción",  name: "descripcion", widget: "text" }
                  - { label: "Hora",         name: "hora",        widget: "string" }
                  - { label: "Tipo de música / ambiente", name: "tipo", widget: "string" }

          # ── Eventos Privados ──────────────────────────────────────────────────
          - label: "Eventos Privados"
            name: "eventosPrivados"
            widget: "object"
            fields:
              - { label: "Título",           name: "titulo",          widget: "string" }
              - { label: "Subtítulo",        name: "subtitulo",       widget: "string" }
              - { label: "Título principal", name: "tituloPrincipal", widget: "string" }
              - { label: "Descripción",      name: "descripcion",     widget: "text" }
              - label: "Características incluidas"
                name: "caracteristicas"
                widget: "list"
                field: { label: "Característica", name: "item", widget: "string" }
              - { label: "Precio de reserva", name: "precio", widget: "string" }

          # ── Contacto ──────────────────────────────────────────────────────────
          - label: "Contacto"
            name: "contacto"
            widget: "object"
            fields:
              - { label: "Título sección", name: "titulo", widget: "string" }

              - label: "Dirección"
                name: "direccion"
                widget: "object"
                fields:
                  - { label: "Línea 1 (calle)", name: "linea1", widget: "string" }
                  - { label: "Línea 2 (ciudad)", name: "linea2", widget: "string" }

              - { label: "Teléfono", name: "telefono", widget: "string" }
              - { label: "Email",    name: "email",    widget: "string" }

              - label: "Horarios"
                name: "horarios"
                widget: "list"
                fields:
                  - { label: "Día",     name: "dia",     widget: "string" }
                  - { label: "Horas",   name: "horas",   widget: "string" }
                  - { label: "Cerrado", name: "cerrado", widget: "boolean", default: false }

              - label: "Redes sociales"
                name: "redesSociales"
                widget: "object"
                fields:
                  - { label: "Instagram (URL)", name: "instagram", widget: "string" }
                  - { label: "Facebook (URL)",  name: "facebook",  widget: "string" }
                  - { label: "Twitter (URL)",   name: "twitter",   widget: "string" }

          # ── Footer ────────────────────────────────────────────────────────────
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Copyright", name: "copyright", widget: "string" }