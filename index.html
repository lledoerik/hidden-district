<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden District - Bar de Cócteles</title>
    <link rel="icon" type="image/jpeg" href="assets/img/favicon.jpg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- Decap CMS Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <!-- Hero Section -->
    <header id="home" class="hero">
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <img src="assets/img/hidden-logo.png" alt="Hidden District">
                </div>
                <ul class="nav-menu">
                    <li><a href="#distrito" class="nav-link">El Distrito</a></li>
                    <li><a href="#cocteles" class="nav-link">Cócteles De Autor</a></li>
                    <li><a href="#eventos" class="nav-link">Eventos</a></li>
                    <li><a href="#eventos-privados" class="nav-link">Eventos Privados</a></li>
                    <li><a href="#contacto" class="nav-link">HORARIO</a></li>
                </ul>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>
        <div class="hero-content">
            <div class="hero-logo">
                <img src="assets/img/hidden-logo.png" alt="Hidden District">
                <p class="tagline" id="hero-tagline"></p>
            </div>
        </div>
        <a href="#distrito" class="scroll-indicator">
            <span>↓</span>
        </a>
    </header>

    <!-- El Distrito Section -->
    <section id="distrito" class="section distrito-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title" id="distrito-titulo"></h2>
                <div class="section-divider"></div>
            </div>
            <div class="distrito-content">
                <div class="distrito-text">
                    <p class="intro-text" id="distrito-intro"></p>
                    <p id="distrito-parrafo1"></p>
                    <p id="distrito-parrafo2"></p>
                </div>
                <div class="distrito-features">
                    <div class="feature">
                        <div class="feature-icon icon-cocktail"></div>
                        <h3>Cócteles</h3>
                        <p>Bebidas conceptuales</p>
                    </div>
                    <div class="feature">
                        <div class="feature-icon icon-music"></div>
                        <h3>Música</h3>
                        <p>Eventos cada semana</p>
                    </div>
                    <div class="feature">
                        <div class="feature-icon icon-mask"></div>
                        <h3>Futbolín</h3>
                        <p>¿Serás el rey de la pista?</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Cócteles de Autor Section -->
    <section id="cocteles" class="section cocteles-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title" id="cocteles-titulo"></h2>
                <div class="section-divider"></div>
                <p class="section-subtitle" id="cocteles-subtitulo"></p>
            </div>

            <div class="menu-tabs">
                <button type="button" class="tab-button active" data-tab="cocteles">Cócteles</button>
                <button type="button" class="tab-button" data-tab="tapas">Tapas</button>
            </div>

            <!-- Contenedor Cócteles -->
            <div id="cocteles-tab" class="menu-content active">
                <div class="cocktail-grid" id="cocktail-grid">
                    <!-- Inyectado por main.js -->
                </div>
            </div>

            <!-- Contenedor Tapas -->
            <div id="tapas-tab" class="menu-content">
                <div class="cocktail-grid" id="tapas-grid">
                    <!-- Inyectado por main.js -->
                </div>
            </div>
        </div>
    </section>

    <!-- Eventos Section -->
    <section id="eventos" class="section eventos-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title" id="eventos-titulo"></h2>
                <div class="section-divider"></div>
                <p class="section-subtitle" id="eventos-subtitulo"></p>
            </div>
            <div class="eventos-grid" id="eventos-grid">
                <!-- Inyectado por main.js -->
            </div>
        </div>
    </section>

    <!-- Eventos Privados Section -->
    <section id="eventos-privados" class="section eventos-privados-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title" id="privados-titulo"></h2>
                <div class="section-divider"></div>
                <p class="section-subtitle" id="privados-subtitulo"></p>
            </div>
            <div class="eventos-privados-content">
                <div class="privados-info">
                    <h3 id="privados-titulo-principal"></h3>
                    <p id="privados-descripcion"></p>
                    <ul class="privados-features" id="privados-caracteristicas">
                        <!-- Inyectado por main.js -->
                    </ul>
                    <div class="privados-pricing">
                        <h4 id="privados-precio"></h4>
                    </div>
                </div>
                <div class="privados-form">
                    <h3>¡Haz tu reserva!</h3>
                    <form id="privados-form">
                        <div class="form-group">
                            <input type="text" placeholder="Nombre completo" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <input type="tel" placeholder="Teléfono" required>
                        </div>
                        <div class="form-group">
                            <input type="date" required aria-label="Fecha del evento">
                        </div>
                        <div class="form-group">
                            <input type="number" placeholder="Aforo" min="1" required>
                        </div>
                        <div class="form-group">
                            <textarea placeholder="Cuéntanos sobre tu evento..." rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Contacto Section -->
    <section id="contacto" class="section contacto-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title" id="contacto-titulo"></h2>
                <div class="section-divider"></div>
            </div>
            <div class="contacto-content">
                <div class="contacto-info">
                    <div class="info-item horari">
                        <h3><i class="icon-clock"></i> Horario</h3>
                        <div class="horari-grid" id="horario-grid">
                            <!-- Inyectado por main.js -->
                        </div>
                    </div>
                </div>
                <div class="contacto-map">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2992.342861805085!2d2.1939823!3d41.41007539999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a4a37d6c5da8cf%3A0xae02baf7d2a580e8!2sHidden%20District!5e0!3m2!1sca!2ses!4v1772491216641!5m2!1sca!2ses"
                        title="Mapa de Hidden District"
                        class="map-iframe"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
            <div class="social-links">
                <h3>CONTACTO</h3>
                <div class="social-icons" id="social-icons">
                    <!-- Inyectado por main.js -->
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p id="footer-copyright"></p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/script.js"></script>

    <!-- Redirección de Netlify Identity al admin -->
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on('init', user => {
                if (!user) {
                    window.netlifyIdentity.on('login', () => {
                        document.location.href = '/admin/';
                    });
                }
            });
        }
    </script>
</body>
</html>
